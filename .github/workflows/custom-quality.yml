name: "custom quality gate"

# Consolidated gate for the custom fork (QA-001): runs every static check
# from planning/06-QA_GATES.md that is CI-runnable, plus the clippy
# warning ratchet. Upstream workflows remain untouched and continue to
# cover upstream branches.

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main
      - "phase/**"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - custom/main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # System deps mirror .github/workflows/test.yml (Tauri Linux build)
      # plus Vulkan user-space for the transcribe-cpp ggml-vulkan feature.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Translation consistency
        run: bun run check:translations

      - name: ESLint
        run: bun run lint

      - name: Formatting (prettier + cargo fmt)
        run: bun run format:check

      - name: Clippy ratchet (custom gate)
        working-directory: src-tauri
        run: python3 ../tests/harness/clippy_ratchet.py

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Frontend build (tsc + vite)
        run: bun run build

      - name: Playwright smoke
        run: bun run test:playwright
