name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              draft: true,
              prerelease: false,
              body: 'Windows x64 update for the long-audio and history hotfix. Real 15-minute microphone and listening validation is scheduled after installation by the owner; report any regression before wider rollout.',
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # AUDIO-240: publish only the NSIS format installed on the owner's
          # Windows x64 machine; other platform releases need their own gates.
          - platform: "windows-latest"
            args: "--bundles nsis"
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      ref: ${{ github.sha }}
      sign-binaries: true
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  finalize-release:
    permissions:
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed Windows updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "v${RELEASE_VERSION}" --json assets --jq '.assets[].name')"
          installer="$(echo "$assets" | grep -E 'x64-setup\.exe$' | head -n 1)"
          echo "$assets" | grep -Fxq "${installer}.sig"
          echo "$assets" | grep -Fxq 'latest.json'
          mkdir -p "$RUNNER_TEMP/handy-release-check"
          gh release download "v${RELEASE_VERSION}" --pattern latest.json --pattern "${installer}.sig" --dir "$RUNNER_TEMP/handy-release-check"
          jq -e --arg version "$RELEASE_VERSION" \
            '.version == $version and
             (.platforms["windows-x86_64"].signature | length > 50)' \
            "$RUNNER_TEMP/handy-release-check/latest.json"
          manifest_url="$(jq -r '.platforms["windows-x86_64"].url' "$RUNNER_TEMP/handy-release-check/latest.json")"
          manifest_signature="$(jq -r '.platforms["windows-x86_64"].signature' "$RUNNER_TEMP/handy-release-check/latest.json")"
          [[ "$manifest_url" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/${installer}" ]]
          [[ "$manifest_signature" == "$(cat "$RUNNER_TEMP/handy-release-check/${installer}.sig")" ]]
      - name: Publish the draft release
        # The updater flow depends on this: a draft release's latest.json is
        # not publicly downloadable, so every installed app reports "no
        # update" until the signed Windows bundle is verified and published.
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
            })
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              make_latest: "legacy",
              prerelease: release.prerelease,
            })
            console.log(`Published release ${release.tag_name} (id ${release.id})`)
