name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              draft: true,
              prerelease: false,
              body: `UP-700 integrates upstream v0.10 with the fork transcription pipeline.

                Architecture: microphone capture now uses handy-recorder. The fork retains isolated transcription workers, durable WAV capture and resumable chunks, queue priorities, History-only late results and disabled live preview.

                Models: ONNX speech models are retired in favor of transcribe-cpp GGML/GGUF models. Use the model migration screen to select and download a compatible replacement; existing ONNX model files cannot be used for inference. Check the selected model before dictating.

                Imports: Opus and WebM join WAV, MP3, AAC/M4A/MP4/M4B/M4R, FLAC, OGG/OGA and MOV audio tracks, subject to supported codecs. AMR remains unsupported. The regular import path streams to a working WAV; the fallback decoder used for formats such as Opus/WebM is limited to 32 MiB input and six minutes of decoded audio. This is not a universal whole-app memory guarantee. This release does not implement audio compression.

                Settings: upstream Custom Words and language detection controls are integrated.

                Shortcuts: recording starts on key-down. In Hold or Toggle mode, releasing before the configured hold threshold locks recording until the next press; holding at least the threshold stops on release. Push to Talk stops on release; Toggle ignores release and stops on the next press. These transitions are covered by automated coordinator tests; installed hardware behavior still needs owner validation.

                Validation limitations: local automated gates and isolated synthetic imports do not replace owner acceptance. Real microphone and checkpoint failure/restart, failed-start with a pending old result, notices/onboarding/session flows, target-app delivery, Floating-Pill, Custom Words reachability, real-format imports, old settings, the installed 0.9.17 to 0.10.1 updater path and a real 15-minute dictation remain owner checks. Publication requires the release gate and any explicitly recorded owner exceptions; preparation alone is not approval.`,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # AUDIO-240: publish only the NSIS format installed on the owner's
          # Windows x64 machine; other platform releases need their own gates.
          - platform: "windows-latest"
            args: "--bundles nsis"
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      ref: ${{ github.sha }}
      sign-binaries: true
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  finalize-release:
    permissions:
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed Windows updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "v${RELEASE_VERSION}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          installer="$(echo "$assets" | grep -E 'x64-setup\.exe$' | head -n 1)"
          echo "$assets" | grep -Fxq "${installer}.sig"
          echo "$assets" | grep -Fxq 'latest.json'
          mkdir -p "$RUNNER_TEMP/handy-release-check"
          gh release download "v${RELEASE_VERSION}" -R "$GITHUB_REPOSITORY" --pattern latest.json --pattern "${installer}.sig" --dir "$RUNNER_TEMP/handy-release-check"
          jq -e --arg version "$RELEASE_VERSION" \
            '.version == $version and
             (.platforms["windows-x86_64"].signature | length > 50)' \
            "$RUNNER_TEMP/handy-release-check/latest.json"
          manifest_url="$(jq -r '.platforms["windows-x86_64"].url' "$RUNNER_TEMP/handy-release-check/latest.json")"
          manifest_signature="$(jq -r '.platforms["windows-x86_64"].signature' "$RUNNER_TEMP/handy-release-check/latest.json")"
          [[ "$manifest_url" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/${installer}" ]]
          [[ "$manifest_signature" == "$(cat "$RUNNER_TEMP/handy-release-check/${installer}.sig")" ]]
      - name: Publish the draft release
        # The updater flow depends on this: a draft release's latest.json is
        # not publicly downloadable, so every installed app reports "no
        # update" until the signed Windows bundle is verified and published.
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
            })
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              make_latest: "legacy",
              prerelease: release.prerelease,
            })
            console.log(`Published release ${release.tag_name} (id ${release.id})`)
